# Cloudflare Worker configuration
name = "stockbrowse-landing"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# Static assets directory
[assets]
directory = "./dist"
binding = "ASSETS"

# KV Namespace binding for waitlist emails
[[kv_namespaces]]
binding = "KV_BINDING"
id = "a2812a6a378141699090db7c031cd49b"
